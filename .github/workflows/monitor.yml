# Apple 香港 iPhone 庫存監控
# GitHub 嘅 schedule 鬧鐘最短約 5 分鐘，而且會遲、會漏。
# 真正監測係 job 入面按 check_interval_seconds（或分鐘）循環查。最快 30 秒。
# state.json 推去 monitor-state，唔好 commit 入 main，否則 GitHub Pages 會每轉紅叉。
# 單條 job 約 5.5 小時正常換班後，會即刻 workflow_dispatch 下一條。
# schedule 只係後備：dispatch 失敗或者 loop 死咗，先靠鬧鐘再拉起。
name: iPhone HK Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: 只發送 Telegram 連線測試短訊（唔係補貨通知）
        type: boolean
        default: false
      apply_simulation:
        description: 套用模擬貨源，只有冇貨→有貨先發測試 Telegram
        type: boolean
        default: false
      ignore_enabled:
        description: 即使真實模式為 OFF 也執行官網查詢
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  check:
    name: Check availability
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      loop_reason: ${{ steps.loop.outputs.reason }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TEST_NOTIFY: ${{ github.event.inputs.test_notify }}
      APPLY_SIMULATION: ${{ github.event.inputs.apply_simulation }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Skip schedule if a loop is already running
        id: already
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          skip = "false"
          if event == "schedule":
              repo = os.environ["GITHUB_REPOSITORY"]
              run_id = str(os.environ["GITHUB_RUN_ID"])
              token = os.environ["GH_TOKEN"]
              url = (
                  f"https://api.github.com/repos/{repo}/actions/workflows/"
                  "monitor.yml/runs?status=in_progress&per_page=20"
              )
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "iphone-monitor",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.load(resp)
              others = [
                  r for r in (data.get("workflow_runs") or [])
                  if str(r.get("id")) != run_id and r.get("status") == "in_progress"
              ]
              skip = "true" if others else "false"
              print("other_in_progress", [r.get("id") for r in others], "skip", skip)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"skip={skip}\n")
          PY

      - name: Gate on enabled flag
        if: steps.already.outputs.skip != 'true'
        id: gate
        run: |
          python3 - <<'PY'
          import json, os
          cfg = json.load(open("config.json", encoding="utf-8"))
          test_notify = os.environ.get("TEST_NOTIFY", "").lower() in {"true", "1", "yes"}
          apply_sim = os.environ.get("APPLY_SIMULATION", "").lower() in {"true", "1", "yes"}
          ignore = "${{ github.event.inputs.ignore_enabled }}" == "true"
          enabled = bool(cfg.get("enabled"))
          oneshot = test_notify or apply_sim
          run = enabled or oneshot or ignore
          loop = run and not oneshot
          print(f"enabled={enabled} oneshot={oneshot} ignore={ignore} run={run} loop={loop}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"run={'true' if run else 'false'}\n")
              fh.write(f"loop={'true' if loop else 'false'}\n")
          PY

      - name: Record usage and warn at 1800 / 2000
        if: steps.already.outputs.skip != 'true' && steps.gate.outputs.loop != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 usage.py

      - name: Setup Python
        if: steps.already.outputs.skip != 'true' && steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.already.outputs.skip != 'true' && steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run checker once
        if: steps.already.outputs.skip != 'true' && steps.gate.outputs.run == 'true' && steps.gate.outputs.loop != 'true'
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.test_notify }}" = "true" ]; then
            ARGS="$ARGS --test-notify"
          fi
          if [ "${{ github.event.inputs.apply_simulation }}" = "true" ]; then
            ARGS="$ARGS --apply-simulation"
          fi
          if [ "${{ github.event.inputs.ignore_enabled }}" = "true" ]; then
            ARGS="$ARGS --ignore-enabled"
          fi
          python checker.py $ARGS

      - name: Warn if previous loop heartbeat is stale
        if: steps.already.outputs.skip != 'true' && steps.gate.outputs.loop == 'true' && github.event_name == 'schedule'
        run: python3 checker.py --loop-restart-check || true

      - name: Run checker loop
        id: loop
        if: steps.already.outputs.skip != 'true' && steps.gate.outputs.loop == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          BRANCH="${GITHUB_REF_NAME}"
          END=$((SECONDS + 330 * 60))
          commit_state() {
            python3 push_state.py --push || echo "push monitor-state 失敗，下一轉再試"
            git checkout -- state.json 2>/dev/null || true
          }
          STOPPED=""
          while [ "$SECONDS" -lt "$END" ]; do
            git pull --rebase origin "${BRANCH}" || {
              echo "pull --rebase 失敗，中止後繼續用而家工作樹"
              git rebase --abort || true
            }
            python3 push_state.py --pull || true
            INTERVAL_SEC=$(python3 -c "import json; from checker import loop_interval_seconds; print(loop_interval_seconds(json.load(open('config.json'))))")
            USAGE_MIN=$(( (INTERVAL_SEC + 59) / 60 ))
            python3 usage.py --minutes "$USAGE_MIN" || true
            python3 checker.py --ignore-interval || true
            commit_state
            python3 - <<'PY' || { STOPPED=disabled; break; }
          import json, sys
          cfg = json.load(open("config.json", encoding="utf-8"))
          sys.exit(0 if cfg.get("enabled") else 1)
          PY
            echo "heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ) next check in ${INTERVAL_SEC} second(s)"
            sleep "$INTERVAL_SEC"
          done
          if [ "$STOPPED" = "disabled" ]; then
            python3 checker.py --loop-stopped disabled || true
            echo "reason=disabled" >> "$GITHUB_OUTPUT"
          else
            python3 checker.py --loop-stopped timeout || true
            echo "reason=timeout" >> "$GITHUB_OUTPUT"
          fi
          commit_state

      - name: Telegram if loop crashed
        if: ${{ (failure() || cancelled()) && steps.already.outputs.skip != 'true' && steps.gate.outputs.loop == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 checker.py --loop-died --loop-died-reason "${{ job.status }}" || true

      - name: Record disabled skip
        if: steps.already.outputs.skip != 'true' && steps.gate.outputs.run != 'true'
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          path = "state.json"
          try:
              state = json.load(open(path, encoding="utf-8"))
          except Exception:
              state = {"items": {}, "schema_version": 1}
          prev = (state.get("last_run") or {}).get("status")
          if prev == "disabled":
              print("skipped: enabled=false (state already recorded)")
              raise SystemExit(0)
          now = datetime.now(tz=ZoneInfo("Asia/Hong_Kong")).isoformat(timespec="seconds")
          state["last_run"] = {
              "status": "disabled",
              "message": "真實模式為 OFF（enabled=false），安全退出，不查詢 Apple API。",
              "notified": 0,
              "checked": 0,
              "at": now,
          }
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(state, fh, ensure_ascii=False, indent=2)
              fh.write("\n")
          print("skipped: enabled=false")
          PY

      - name: Publish state.json to monitor-state
        if: ${{ always() && steps.already.outputs.skip != 'true' }}
        run: python3 push_state.py --push || true

  chain:
    name: Start next loop immediately
    needs: check
    if: ${{ needs.check.outputs.loop_reason == 'timeout' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch next monitor loop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME:-main}"
          echo "Previous loop hit the 5.5h handoff. Dispatching the next loop on ${BRANCH}."
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/monitor.yml/dispatches" \
            -f "ref=${BRANCH}"
          echo "Next loop dispatched."
